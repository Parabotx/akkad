general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(e8e1d5ff)
    font_size = 76
    font_family = JetBrainsMono Nerd Font
    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A · %d %B"
    color = rgba(c9a66bff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 45
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 54
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = true
    outer_color = rgba(c9a66bff)
    inner_color = rgba(17191fff)
    font_color = rgba(e8e1d5ff)
    fade_on_empty = false
    placeholder_text = <i>Enter passphrase</i>
    position = 0, -70
    halign = center
    valign = center
}
